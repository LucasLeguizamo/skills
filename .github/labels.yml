# Canonical label set. One `type:*` per PR, plus every `area:*` the changed paths
# match (mapping lives in labeler.yml), plus every risk label that applies.
# Seed or update the repo's labels with: ./scripts/sync-labels.sh

- name: "type:feat"
  color: "0e8a16"
  description: "New capability for a person or an agent"
- name: "type:fix"
  color: "d73a4a"
  description: "Corrects broken behavior"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation, ADRs, contracts"
- name: "type:chore"
  color: "cfd3d7"
  description: "Tooling, config, dependencies, housekeeping"
- name: "type:refactor"
  color: "fbca04"
  description: "Same behavior, better structure"

- name: "db-migration"
  color: "b60205"
  description: "Touches the schema or needs SQL in production — the SQL goes in the body"
- name: "needs-env-var"
  color: "d93f0b"
  description: "Requires a new environment variable before merging"
- name: "needs-followup-pr"
  color: "fef2c0"
  description: "The change is not complete with this PR alone"
- name: "depends-on-pr"
  color: "b60205"
  description: "Does not merge until the prior PR lands and this label is removed"
- name: "breaking-change"
  color: "5319e7"
  description: "Breaks a public API, a contract or existing data"

- name: "area:app"
  color: "1d76db"
  description: "Product code"
- name: "area:api"
  color: "006b75"
  description: "Public surfaces: routes, MCP, CLI — and their route.md"
- name: "area:agents"
  color: "5319e7"
  description: "AGENTS.md, CLAUDE.md, .claude/"
- name: "area:ci"
  color: "0052cc"
  description: ".github/ and scripts/ — checks and tooling"
- name: "area:docs"
  color: "bfd4f2"
  description: "docs/, READMEs, ADRs"
